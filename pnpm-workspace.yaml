packages:
  - "apps/*"
  - "packages/*"
  - "contracts"

overrides:
  qr: "0.5.5"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  utf-8-validate: true

# pnpm 10+: explicitly allow postinstall/build scripts for trusted native packages
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - bufferutil
  - esbuild
  - keccak
  - msgpackr-extract
  - prisma
  - sharp
  - utf-8-validate
